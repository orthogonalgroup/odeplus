name: Feature request
description: Ask for a new capability, or an improvement to an existing one
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
assignees: ["Orthogonalpub"]
body:
  - type: markdown
    attributes:
      value: |
        ### Search before you file

        Please [search existing issues](../?q=is%3Aissue) first. If someone has already asked for this, add a 👍 and describe your own use case on that issue — how many people have asked for the same thing feeds directly into how it gets prioritised.

        Ideas you have not fully worked out are welcome in [Discussions](../../discussions) instead.

  - type: checkboxes
    id: presubmit
    attributes:
      label: Before filing
      options:
        - label: I searched the existing issues and did not find this request
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: |
        Describe the **problem** before describing a solution. We can judge "is this difficulty worth solving" far more reliably than "is this the right design".
      placeholder: e.g. Every time I adjust a parameter I have to re-enter all the boundary conditions by hand — a dozen times a day, and easy to get wrong
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What improvement would you like to see
      description: It does not need to be a complete design. "It would be enough if I could just ..." is fine.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How do you work around it today
      description: Any temporary workaround? This helps us judge how urgent it is.
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: How much would this matter to you
      options:
        - Without it I cannot do my work in ODE+
        - It would clearly improve my throughput; today I do it manually
        - Nice to have, does not affect my current work
        - Just an idea, take it or leave it
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Use cases, how other tools handle it, sketches
    validations:
      required: false
